name: Automated Security Scanning (DevSecOps)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run a weekly deep security scan every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  # Allow Node 20 runtime compatibility for third-party actions during Node 24 rollout
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================================================
  # 1. GitGuardian: Automated Secret & Credential Detection in Commits & PRs
  # ============================================================================
  gitguardian-secret-scan:
    name: GitGuardian Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history is required for commit scanning

      - name: Run GitGuardian ggshield Secret Scan
        uses: GitGuardian/ggshield-action@v1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        continue-on-error: true # Prevents pipeline abort if token is not yet configured

  # ============================================================================
  # 2. MobSF: Mobile Security Framework SAST Scan for Android & Flutter
  # ============================================================================
  mobsf-mobile-sast:
    name: MobSF Mobile SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run mobsfscan (Mobile Security Framework Static Analyzer)
        uses: MobSF/mobsfscan@main
        with:
          args: 'mobile --sarif --output mobsf-results.sarif'
        continue-on-error: true

      # Upload SARIF to GitHub Security tab (succeeds if Code Scanning is enabled in repo settings)
      - name: Upload MobSF SARIF Report to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true # Prevents failure if Code Scanning feature is not enabled in repo
        with:
          sarif_file: mobsf-results.sarif
          category: mobsf-mobile-security

      # Always archive the scan result as a downloadable artifact in GitHub Actions summary
      - name: Upload MobSF Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: mobsf-security-report
          path: mobsf-results.sarif
          retention-days: 14

  # ============================================================================
  # 3. Snyk: Dependency Vulnerability & CVE Scanning (Backend & Mobile)
  # ============================================================================
  snyk-dependency-scan:
    name: Snyk Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk Test on Spring Boot Backend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "Running Snyk dependency test..."
            cd backend
            snyk test --sarif-file-output=../snyk-backend.sarif || true
          else
            echo "SNYK_TOKEN secret is not configured. Skipping Snyk scan."
          fi

      - name: Check if Snyk Report Exists
        id: check_snyk_sarif
        run: |
          if [ -f "snyk-backend.sarif" ]; then
            echo "sarif_exists=true" >> $GITHUB_OUTPUT
          else
            echo "sarif_exists=false" >> $GITHUB_OUTPUT
          fi

      # Upload SARIF to GitHub Security tab if generated and Code Scanning is enabled
      - name: Upload Snyk Backend SARIF Report to GitHub Security Tab
        if: steps.check_snyk_sarif.outputs.sarif_exists == 'true'
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true # Prevents failure if Code Scanning feature is not enabled in repo
        with:
          sarif_file: snyk-backend.sarif
          category: snyk-backend-dependencies

      # Archive Snyk report as a downloadable artifact in GitHub Actions summary
      - name: Upload Snyk Report Artifact
        if: steps.check_snyk_sarif.outputs.sarif_exists == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: snyk-backend-report
          path: snyk-backend.sarif
          retention-days: 14
