spring:
  application:
    name: money-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.usjlhzwgmfwudgnqowhm}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      keepalive-time: 30000
      validation-timeout: 3000
      data-source-properties:
        prepareThreshold: 0
        tcpKeepAlive: true
        socketTimeout: 60
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 3
    # V0_1 (baseline schema for empty databases) sits below the production baseline;
    # don't fail validation on databases that never ran it.
    ignore-migration-patterns: "*:ignored"
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
  data:
    web:
      pageable:
        max-page-size: 100
server:
  port: ${PORT:10000}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain,application/xml,text/css,application/javascript
    min-response-size: 512
